<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="crestBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="70%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011712" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="ballGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.5" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Base Circle Frame with Rounded Shield Aesthetic -->
  <circle cx="256" cy="256" r="248" fill="url(#crestBg)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#softGlow)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" />

  <!-- Crossed Tennis Rackets in Background -->
  <g stroke="url(#goldGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <line x1="120" y1="392" x2="200" y2="312" stroke-width="12" stroke="#d97706" />
    <line x1="120" y1="392" x2="200" y2="312" stroke-width="8" stroke="#fef08a" />
    <ellipse cx="286" cy="226" rx="58" ry="76" transform="rotate(45 286 226)" stroke-width="8" stroke="url(#goldGrad)" />

    <line x1="392" y1="392" x2="312" y2="312" stroke-width="12" stroke="#d97706" />
    <line x1="392" y1="392" x2="312" y2="312" stroke-width="8" stroke="#fef08a" />
    <ellipse cx="226" cy="226" rx="58" ry="76" transform="rotate(-45 226 226)" stroke-width="8" stroke="url(#goldGrad)" />
  </g>

  <!-- Central Golden Tennis Ball -->
  <circle cx="256" cy="226" r="54" fill="url(#ballGold)" stroke="#ffffff" stroke-width="4" filter="url(#softGlow)" />
  <path d="M 222 184 C 248 198, 248 254, 222 268" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 290 184 C 264 198, 264 254, 290 268" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- Gentleman's Shirt Collar & Tuxedo Bow Tie -->
  <g filter="url(#softGlow)">
    <polygon points="212,286 256,318 230,332" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <polygon points="300,286 256,318 282,332" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 256 326 L 202 306 C 194 324, 194 338, 202 356 L 256 336 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3.5" />
    <path d="M 256 326 L 310 306 C 318 324, 318 338, 310 356 L 256 336 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3.5" />
    <rect x="245" y="320" width="22" height="24" rx="6" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />
  </g>

  <!-- Top Hat Accent -->
  <g filter="url(#softGlow)">
    <ellipse cx="256" cy="116" rx="38" ry="8" fill="url(#goldGrad)" />
    <path d="M 232 114 L 236 74 L 276 74 L 280 114 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3.5" />
    <rect x="234" y="102" width="44" height="9" fill="#d97706" />
  </g>

  <!-- Monogram Banner -->
  <g filter="url(#softGlow)">
    <path d="M 110 410 Q 256 425 402 410 L 394 458 Q 256 478 118 458 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2.5" />
    <text x="256" y="444" font-family="sans-serif" font-size="22" font-weight="900" letter-spacing="3" fill="#022c22" text-anchor="middle">
      LIGA GENTLEMANÓW
    </text>
    <text x="256" y="488" font-family="sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="#fef08a" text-anchor="middle">
      TENIS • FAIR PLAY
    </text>
  </g>
</svg>
