<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="crestBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="70%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011712" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="ballGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.5" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Base Circle Frame with Rounded Shield Aesthetic -->
  <circle cx="256" cy="256" r="248" fill="url(#crestBg)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#softGlow)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" />

  <!-- Crossed Tennis Rackets in Background -->
  <g stroke="url(#goldGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Left Racket (slanted right) -->
    <!-- Handle -->
    <line x1="120" y1="392" x2="200" y2="312" stroke-width="12" stroke="#d97706" />
    <line x1="120" y1="392" x2="200" y2="312" stroke-width="8" stroke="#fef08a" />
    <!-- Grip bands -->
    <line x1="130" y1="382" x2="140" y2="372" stroke="#78350f" stroke-width="3" />
    <line x1="150" y1="362" x2="160" y2="352" stroke="#78350f" stroke-width="3" />
    <line x1="170" y1="342" x2="180" y2="332" stroke="#78350f" stroke-width="3" />
    <!-- Throat -->
    <path d="M 200 312 L 225 287 M 200 312 L 235 297" stroke-width="5" />
    <!-- Head -->
    <ellipse cx="286" cy="226" rx="58" ry="76" transform="rotate(45 286 226)" stroke-width="8" stroke="url(#goldGrad)" />
    <!-- Strings -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.4">
      <line x1="240" y1="200" x2="332" y2="292" />
      <line x1="250" y1="180" x2="342" y2="272" />
      <line x1="260" y1="160" x2="352" y2="252" />
      <line x1="220" y1="252" x2="312" y2="160" />
      <line x1="240" y1="272" x2="332" y2="180" />
      <line x1="260" y1="292" x2="352" y2="200" />
    </g>

    <!-- Right Racket (slanted left) -->
    <!-- Handle -->
    <line x1="392" y1="392" x2="312" y2="312" stroke-width="12" stroke="#d97706" />
    <line x1="392" y1="392" x2="312" y2="312" stroke-width="8" stroke="#fef08a" />
    <!-- Grip bands -->
    <line x1="382" y1="382" x2="372" y2="372" stroke="#78350f" stroke-width="3" />
    <line x1="362" y1="362" x2="352" y2="352" stroke="#78350f" stroke-width="3" />
    <line x1="342" y1="342" x2="332" y2="332" stroke="#78350f" stroke-width="3" />
    <!-- Throat -->
    <path d="M 312 312 L 287 287 M 312 312 L 277 297" stroke-width="5" />
    <!-- Head -->
    <ellipse cx="226" cy="226" rx="58" ry="76" transform="rotate(-45 226 226)" stroke-width="8" stroke="url(#goldGrad)" />
    <!-- Strings -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.4">
      <line x1="272" y1="200" x2="180" y2="292" />
      <line x1="262" y1="180" x2="170" y2="272" />
      <line x1="252" y1="160" x2="160" y2="252" />
      <line x1="292" y1="252" x2="200" y2="160" />
      <line x1="272" y1="272" x2="180" y2="180" />
      <line x1="252" y1="292" x2="160" y2="200" />
    </g>
  </g>

  <!-- Laurel Wreath Around Crest (Elegance & Championship) -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <!-- Left Leaves -->
    <path d="M 108 260 C 100 240, 115 225, 125 235 C 120 248, 112 255, 108 260 Z" />
    <path d="M 115 210 C 110 190, 128 180, 136 190 C 130 202, 120 206, 115 210 Z" />
    <path d="M 132 165 C 130 145, 150 140, 156 152 C 148 162, 138 164, 132 165 Z" />
    <path d="M 160 128 C 162 108, 182 108, 186 122 C 176 130, 166 129, 160 128 Z" />
    <path d="M 198 100 C 204 82, 224 86, 224 100 C 214 106, 204 103, 198 100 Z" />
    <path d="M 108 310 C 100 330, 116 342, 125 332 C 120 320, 112 314, 108 310 Z" />
    <path d="M 120 355 C 115 375, 134 382, 140 370 C 133 360, 124 357, 120 355 Z" />
    <path d="M 145 395 C 145 412, 165 415, 168 402 C 158 395, 150 394, 145 395 Z" />

    <!-- Right Leaves -->
    <path d="M 404 260 C 412 240, 397 225, 387 235 C 392 248, 400 255, 404 260 Z" />
    <path d="M 397 210 C 402 190, 384 180, 376 190 C 382 202, 392 206, 397 210 Z" />
    <path d="M 380 165 C 382 145, 362 140, 356 152 C 364 162, 374 164, 380 165 Z" />
    <path d="M 352 128 C 350 108, 330 108, 326 122 C 336 130, 346 129, 352 128 Z" />
    <path d="M 314 100 C 308 82, 288 86, 288 100 C 298 106, 308 103, 314 100 Z" />
    <path d="M 404 310 C 412 330, 396 342, 387 332 C 392 320, 400 314, 404 310 Z" />
    <path d="M 392 355 C 397 375, 378 382, 372 370 C 379 360, 388 357, 392 355 Z" />
    <path d="M 367 395 C 367 412, 347 415, 344 402 C 354 395, 362 394, 367 395 Z" />
  </g>

  <!-- Central Gentleman Silhouette Motif: Bowtie, Shirt Collar & Golden Tennis Ball -->
  <!-- Golden Tennis Ball as the heart of the crest -->
  <circle cx="256" cy="226" r="48" fill="url(#ballGold)" stroke="#ffffff" stroke-width="3" filter="url(#softGlow)" />
  <!-- Tennis ball seams -->
  <path d="M 226 188 C 248 200, 248 252, 226 264" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <path d="M 286 188 C 264 200, 264 252, 286 264" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Gentleman's Shirt Collar & Tuxedo Bow Tie directly below the ball -->
  <g filter="url(#softGlow)">
    <!-- White Shirt Collar Points -->
    <polygon points="216,282 256,312 232,326" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <polygon points="296,282 256,312 280,326" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Gentleman's Velvet Bow Tie -->
    <!-- Left wing -->
    <path d="M 256 322 L 208 304 C 200 320, 200 334, 208 350 L 256 332 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Right wing -->
    <path d="M 256 322 L 304 304 C 312 320, 312 334, 304 350 L 256 332 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Center knot -->
    <rect x="246" y="316" width="20" height="22" rx="6" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1" />
  </g>

  <!-- Crown / Top Hat Accent at Top of Shield -->
  <g filter="url(#softGlow)">
    <!-- Small Gentleman's Silk Top Hat -->
    <!-- Brim -->
    <ellipse cx="256" cy="116" rx="34" ry="7" fill="url(#goldGrad)" />
    <!-- Crown of hat -->
    <path d="M 234 114 L 238 78 L 274 78 L 278 114 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Hat ribbon -->
    <rect x="236" y="103" width="40" height="8" fill="#d97706" />
  </g>

  <!-- Bottom Classic Banner: "LIGA GENTLEMANÓW" -->
  <g filter="url(#softGlow)">
    <!-- Ribbon background -->
    <path d="M 80 430 L 120 405 L 120 445 Z" fill="#78350f" />
    <path d="M 432 430 L 392 405 L 392 445 Z" fill="#78350f" />

    <path d="M 110 410 Q 256 425 402 410 L 394 456 Q 256 475 118 456 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
    
    <!-- Inner ribbon line -->
    <path d="M 120 416 Q 256 430 392 416" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.8" />
    <path d="M 126 448 Q 256 466 386 448" fill="none" stroke="#78350f" stroke-width="1" opacity="0.8" />

    <!-- Banner Typography -->
    <text x="256" y="442" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" letter-spacing="3" fill="#022c22" text-anchor="middle">
      LIGA GENTLEMANÓW
    </text>
    <text x="256" y="488" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="4" fill="#fef08a" text-anchor="middle" opacity="0.9">
      TENIS • FAIR PLAY • EST. 2026
    </text>
  </g>
</svg>
